name: Build Cloudstream Plugins

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "cloudstream/**"
      - ".github/workflows/cloudstream-build.yml"

permissions:
  contents: write

concurrency:
  group: cloudstream-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Cloudstream artifacts
        run: |
          cd cloudstream
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Collect artifacts
        run: |
          mkdir -p build-artifacts
          shopt -s globstar nullglob
          cp cloudstream/**/build/*.cs3 build-artifacts/ || true
          cp cloudstream/build/plugins.json build-artifacts/
          ls -la build-artifacts

      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build-artifacts
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin builds

